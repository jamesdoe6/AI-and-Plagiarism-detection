<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Plagiarism-Detector — AI &amp; plagiarism detection</title>
<meta name="description" content="AI-generated text and plagiarism detector running entirely in your browser: hundreds of linguistic metrics, an ensemble of detectors, configurable web search and a downloadable report.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/glass.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

<div class="aurora" aria-hidden="true"></div>
<div class="grid-overlay" aria-hidden="true"></div>

<header class="topbar-wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🔍</div>
      <div>
        <div class="brand-name">AI-Plagiarism-Detector</div>
        <div class="brand-tag" data-i18n="app.tagline"></div>
      </div>
    </div>

    <label class="switch no-print" data-i18n-attr="title:app.expertModeTitle">
      <input type="checkbox" id="expert-toggle">
      <span class="switch-track"></span>
      <span class="switch-label" data-i18n="app.expertMode"></span>
    </label>

    <div class="lang-switch glass no-print" id="lang-switch" role="group" data-i18n-attr="aria-label:app.switchLanguage">
      <span class="lang-pill" aria-hidden="true"></span>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    </div>

    <button class="btn glass-button no-print" id="settings-btn">
      <span aria-hidden="true">⚙</span><span data-i18n="app.settings"></span>
    </button>
  </div>
</header>

<main class="shell">

  <section class="hero">
    <h1 data-i18n-html="hero.title"></h1>
    <p data-i18n="hero.subtitle"></p>
  </section>

  <div class="notice no-print" style="margin-bottom: var(--gap)">
    <span class="notice-icon" aria-hidden="true">⚠️</span>
    <div>
      <strong data-i18n="banner.strong"></strong>
      <span data-i18n="banner.body"></span>
      <strong data-i18n="banner.strong2"></strong>
      <a href="#disclaimers" data-i18n="banner.link"></a>
    </div>
  </div>

  <!-- ============ 1. Input ============ -->
  <section class="glass glass-strong section" id="input-section">
    <div class="section-head">
      <h2 data-i18n="input.heading"></h2>
      <div class="tabs" role="tablist" data-i18n-attr="aria-label:input.heading">
        <button class="tab" role="tab" id="tab-paste" aria-selected="true" aria-controls="pane-paste" data-i18n="input.tabPaste"></button>
        <button class="tab" role="tab" id="tab-file" aria-selected="false" aria-controls="pane-file" data-i18n="input.tabFile"></button>
      </div>
    </div>

    <div id="pane-paste" role="tabpanel" aria-labelledby="tab-paste">
      <label class="visually-hidden" for="text-input" data-i18n="input.label"></label>
      <textarea class="textarea" id="text-input" spellcheck="false" data-i18n-attr="placeholder:input.placeholder"></textarea>
    </div>

    <div id="pane-file" role="tabpanel" aria-labelledby="tab-file" hidden>
      <div class="dropzone" id="dropzone" tabindex="0" role="button" data-i18n-attr="aria-label:input.dropAria">
        <div class="dropzone-icon" aria-hidden="true">📄</div>
        <div><strong data-i18n="input.dropTitle"></strong> <span data-i18n="input.dropOr"></span></div>
        <div class="dropzone-formats" data-i18n="input.formats"></div>
      </div>
      <input type="file" id="file-input" class="visually-hidden" accept=".txt,.md,.markdown,.csv,.rtf,.html,.htm,.docx,.odt,.pdf">
      <div id="file-status" class="row" style="margin-top:12px" hidden></div>
    </div>

    <div class="row" style="margin-top:18px">
      <span class="small dim" id="counter"></span>
      <div class="row row-end">
        <label class="switch"><input type="checkbox" id="opt-ai" checked><span class="switch-track"></span><span class="switch-label" data-i18n="input.optAi"></span></label>
        <label class="switch"><input type="checkbox" id="opt-plag" checked><span class="switch-track"></span><span class="switch-label" data-i18n="input.optPlagiarism"></span></label>
        <button class="btn glass-button btn-sm" id="sample-btn" data-i18n="input.sample"></button>
        <button class="btn glass-button btn-sm" id="clear-btn" data-i18n="input.clear"></button>
        <button class="btn btn-primary glass-button" id="analyze-btn" data-i18n="input.analyse"></button>
      </div>
    </div>

    <div id="input-error" class="notice notice-danger" style="margin-top:14px" hidden></div>
    <div id="provider-hint" class="notice notice-info" style="margin-top:14px" hidden></div>
  </section>

  <!-- ============ Progress ============ -->
  <section class="glass section no-print" id="progress-section" hidden>
    <div class="section-head">
      <h2 data-i18n="progress.heading"></h2>
      <button class="btn btn-sm btn-ghost" id="cancel-btn" data-i18n="progress.cancel"></button>
    </div>
    <div class="progress">
      <div class="progress-step">
        <span class="spinner" id="progress-spinner"></span>
        <span id="progress-label"></span>
        <span class="row-end small dim tabular" id="progress-pct">0 %</span>
      </div>
      <div class="progress-bar"><i id="progress-fill" style="width:0%"></i></div>
      <div class="log" id="progress-log" aria-live="polite"></div>
    </div>
  </section>

  <!-- ============ 2. AI results ============ -->
  <section class="glass glass-strong section" id="ai-section" hidden>
    <div class="section-head">
      <h2 data-i18n="ai.heading"></h2>
      <span class="badge badge-neutral" id="ai-confidence-badge"></span>
      <span class="badge badge-neutral" id="ai-features-badge"></span>
    </div>

    <div class="score-card">
      <div class="gauge">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="gauge-track" cx="60" cy="60" r="52"></circle>
          <circle class="gauge-value" id="ai-gauge" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
        </svg>
        <div class="gauge-center">
          <div class="gauge-number" id="ai-score">—</div>
          <div class="gauge-unit" data-i18n="ai.gaugeUnit"></div>
        </div>
      </div>
      <div class="score-body">
        <div class="score-verdict" id="ai-verdict"></div>
        <div class="scale" id="ai-scale" aria-hidden="true"></div>
        <div class="scale-marker"><i id="ai-marker" style="left:0%"></i></div>
        <div class="scale-legend">
          <span data-i18n="ai.scaleHuman"></span>
          <span data-i18n="ai.scaleUncertain"></span>
          <span data-i18n="ai.scaleMixed"></span>
          <span data-i18n="ai.scaleLikely"></span>
          <span data-i18n="ai.scaleAi"></span>
        </div>
        <ul class="reasons" id="ai-reasons" style="margin-top:18px"></ul>
      </div>
    </div>

    <div style="margin-top:22px" id="ai-detectors"></div>
    <div style="margin-top:14px" id="ai-expert" hidden></div>
  </section>

  <!-- ============ 3. Plagiarism results ============ -->
  <section class="glass glass-strong section" id="plag-section" hidden>
    <div class="section-head">
      <h2 data-i18n="plagiarism.heading"></h2>
      <span class="badge badge-neutral" id="plag-queries-badge"></span>
    </div>

    <div class="score-card">
      <div class="gauge">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="gauge-track" cx="60" cy="60" r="52"></circle>
          <circle class="gauge-value" id="plag-gauge" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
        </svg>
        <div class="gauge-center">
          <div class="gauge-number" id="plag-score">—</div>
          <div class="gauge-unit" data-i18n="plagiarism.gaugeUnit"></div>
        </div>
      </div>
      <div class="score-body">
        <div class="score-verdict" id="plag-verdict"></div>
        <p class="small muted" id="plag-note"></p>
      </div>
    </div>

    <div style="margin-top:20px" id="plag-sources"></div>
    <div style="margin-top:12px" id="plag-errors"></div>
  </section>

  <!-- ============ Export ============ -->
  <section class="glass section no-print" id="export-section" hidden>
    <div class="section-head"><h2 data-i18n="report.heading"></h2></div>
    <p class="small muted" data-i18n="report.intro"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn btn-primary glass-button" id="report-html-btn" data-i18n="report.downloadHtml"></button>
      <button class="btn glass-button" id="report-pdf-btn" data-i18n="report.printPdf"></button>
      <button class="btn glass-button" id="report-json-btn" data-i18n="report.downloadJson"></button>
    </div>
  </section>

  <!-- ============ Expert mode explainer ============ -->
  <section class="glass section" id="expert-info">
    <div class="section-head"><h2 data-i18n="expert.heading"></h2></div>
    <p class="muted" data-i18n="expert.intro"></p>
    <div class="expert-grid">
      <div class="expert-item">
        <span class="expert-num" aria-hidden="true">1</span>
        <h3 data-i18n="expert.item1Title"></h3>
        <p data-i18n="expert.item1Body"></p>
      </div>
      <div class="expert-item">
        <span class="expert-num" aria-hidden="true">2</span>
        <h3 data-i18n="expert.item2Title"></h3>
        <p data-i18n="expert.item2Body"></p>
      </div>
      <div class="expert-item">
        <span class="expert-num" aria-hidden="true">3</span>
        <h3 data-i18n="expert.item3Title"></h3>
        <p data-i18n="expert.item3Body"></p>
      </div>
      <div class="expert-item">
        <span class="expert-num" aria-hidden="true">4</span>
        <h3 data-i18n="expert.item4Title"></h3>
        <p data-i18n="expert.item4Body"></p>
      </div>
    </div>
    <div class="notice notice-info" style="margin-top:16px">
      <span class="notice-icon" aria-hidden="true">💡</span>
      <div data-i18n="expert.tip"></div>
    </div>
  </section>

  <!-- ============ Limitations ============ -->
  <section class="glass section" id="disclaimers">
    <div class="section-head"><h2 data-i18n="disclaimers.heading"></h2></div>
    <div id="disclaimer-list"></div>
    <details class="panel" style="margin-top:16px">
      <summary data-i18n="disclaimers.methodAiTitle"></summary>
      <div class="panel-body small muted" id="method-ai"></div>
    </details>
    <details class="panel">
      <summary data-i18n="disclaimers.methodPlagTitle"></summary>
      <div class="panel-body small muted" id="method-plag"></div>
    </details>
  </section>

  <footer class="footer">
    <p data-i18n-html="footer.body"></p>
    <ul>
      <li><a href="docs/METRICS.md" data-i18n="footer.metrics"></a></li>
      <li><a href="docs/LIMITATIONS.md" data-i18n="footer.limitations"></a></li>
      <li><a href="docs/API-SETUP.md" data-i18n="footer.apis"></a></li>
    </ul>
  </footer>
</main>

<!-- ============ Settings drawer ============ -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <h2 id="drawer-title" data-i18n="settings.heading"></h2>
    <button class="btn btn-icon glass-button" id="drawer-close" data-i18n-attr="aria-label:settings.close">✕</button>
  </div>

  <div class="notice notice-info" style="margin-bottom:14px">
    <span class="notice-icon" aria-hidden="true">🔐</span>
    <div class="tiny" data-i18n-html="settings.privacy"></div>
  </div>

  <div class="drawer-group">
    <h3 data-i18n="settings.searchTitle"></h3>
    <span class="hint" data-i18n="settings.searchHint"></span>
    <div class="drawer-fields">
      <div class="field">
        <label for="set-search-provider" data-i18n="settings.provider"></label>
        <select class="select" id="set-search-provider"></select>
      </div>
      <div class="field" id="field-search-key">
        <label for="set-search-key" data-i18n="settings.apiKey"></label>
        <input class="input" id="set-search-key" type="password" autocomplete="off" data-i18n-attr="placeholder:settings.apiKeyPlaceholder">
      </div>
      <div class="field" id="field-search-extra" hidden>
        <label for="set-search-extra" id="label-search-extra"></label>
        <input class="input" id="set-search-extra" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="set-max-queries" data-i18n="settings.budget"></label>
        <input class="input" id="set-max-queries" type="number" min="4" max="120" step="1">
        <span class="hint" data-i18n="settings.budgetHint"></span>
      </div>
      <label class="switch"><input type="checkbox" id="set-use-reader" checked><span class="switch-track"></span><span class="switch-label" data-i18n="settings.useReader"></span></label>
      <div class="field">
        <label for="set-reader" data-i18n="settings.reader"></label>
        <input class="input mono" id="set-reader" type="text" spellcheck="false">
        <span class="hint" data-i18n-html="settings.readerHint"></span>
      </div>
    </div>
  </div>

  <div class="drawer-group">
    <h3 data-i18n="settings.aiTitle"></h3>
    <span class="hint" data-i18n-html="settings.aiHint"></span>
    <div class="drawer-fields">
      <div class="field">
        <label for="set-ai-provider" data-i18n="settings.provider"></label>
        <select class="select" id="set-ai-provider"></select>
      </div>
      <div class="field" id="field-ai-key" hidden>
        <label for="set-ai-key" data-i18n="settings.apiKey"></label>
        <input class="input" id="set-ai-key" type="password" autocomplete="off">
      </div>
      <div class="field" id="field-ai-extra" hidden>
        <label for="set-ai-extra" id="label-ai-extra"></label>
        <input class="input" id="set-ai-extra" type="text" autocomplete="off">
      </div>
      <div class="field" id="field-ai-model" hidden>
        <label for="set-ai-model" data-i18n="settings.model"></label>
        <input class="input mono" id="set-ai-model" type="text" spellcheck="false">
      </div>
    </div>
  </div>

  <div class="drawer-group">
    <h3 data-i18n="settings.localTitle"></h3>
    <span class="hint" data-i18n-html="settings.localHint"></span>
    <label class="visually-hidden" for="set-local-sources" data-i18n="settings.localTitle"></label>
    <textarea class="textarea mono" id="set-local-sources" style="min-height:140px" data-i18n-attr="placeholder:settings.localPlaceholder"></textarea>
  </div>

  <div class="drawer-group">
    <h3 data-i18n="settings.thresholdTitle"></h3>
    <span class="hint" data-i18n="settings.thresholdHint"></span>
    <div class="drawer-fields">
      <div class="field">
        <label for="set-threshold" id="threshold-label"></label>
        <input type="range" id="set-threshold" min="55" max="95" step="5">
      </div>
    </div>
  </div>

  <div class="row" style="margin-top:18px">
    <button class="btn glass-button" id="reset-settings" data-i18n="settings.reset"></button>
    <button class="btn btn-primary glass-button row-end" id="save-settings" data-i18n="settings.save"></button>
  </div>
</aside>

<script type="module" src="assets/js/app.js"></script>
<noscript>
  <div class="shell"><div class="notice notice-danger" style="margin-top:20px">
    This application needs JavaScript: all the analysis runs in your browser.
  </div></div>
</noscript>
</body>
</html>
